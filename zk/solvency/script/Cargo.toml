[package]
name = "dpo2u-solvency-script"
version = "0.1.0"
edition = "2021"
default-run = "solvency"

[[bin]]
name = "solvency"
path = "src/bin/main.rs"

[dependencies]
sp1-sdk = { version = "=6.1.0", features = ["blocking", "native-gnark"] }
dpo2u-solvency-lib = { path = "../lib" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }

[build-dependencies]
sp1-build = "=6.1.0"
